epochs: 50
learning_rate: 2e-4
weight_decay: 0.0

optimizer:
  type: "adamw"
  betas: [0.9, 0.999]

scheduler:
  use_scheduler: true
  type: "cosine"
  warmup_epochs: 5

log_every_n_steps: 50
sample_every_n_epochs: 5
save_every_n_epochs: 10

vis_n_samples: 64
vis_n_trajectories: 16

compute_fid: false
