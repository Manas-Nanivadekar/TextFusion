network:
  type: "ConditionalUNet"
  in_channels: 1
  out_channels: 1
  base_channels: 64
  channel_multipliers: [1, 2, 4]
  num_res_blocks: 2
  time_emb_dim: 256
  num_classes: 10
  class_emb_dim: 128
  use_attention: true
  dropout: 0.1

unconditional_prob: 0.1

sampling:
  n_steps: 50
  clip_samples: true
  image_shape: [1, 28, 28]
  guidance_scale: 3.0
